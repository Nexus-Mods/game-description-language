gdl: 1
game:
  id: helloworld
  name: Hello World
  executable: HelloWorld.exe
  requiredFiles: [HelloWorld.exe]
context:
  modsRoot: ${installPath}/Mods
modTypes:
  - id: pak
    name: Pak Mod
    path: ${modsRoot}
  - id: lua
    name: Lua Mod
    path: ${installPath}/Scripts
  # Deploys outside the game folder, so it must not remove hardlink/move for
  # the whole game when the staging folder is on another volume.
  - id: config
    name: Config
    path: ${appDataLocal}/HelloWorld/Config
    deploymentEssential: false
